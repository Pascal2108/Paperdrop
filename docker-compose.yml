services:
  paperdrop:
    image: ghcr.io/pascal2108/paperdrop:latest
    container_name: paperdrop
    restart: unless-stopped
    env_file:
      - secrets.env
    environment:
      PAPERLESS_URL: http://paperless-webserver-1:8000   # CHANGE: container name of your Paperless webserver
      # APP_NAME: Paperdrop       # (optional) name shown on the page
      # THEME: dark               # (optional) colours of the page: dark, light or auto (follows the device)
      # GS_QUALITY: ebook         # (optional) preselected compression: printer (light), ebook (balanced) or screen (strong)
      # MAX_UPLOAD_MB: 200        # (optional) largest accepted file in MB
      # SESSION_HOURS: 24         # (optional) hours you stay signed in
      # KEEP_MINUTES: 30          # (optional) minutes until files that were neither uploaded nor deleted are removed
      # LOG_LEVEL: INFO           # (optional) DEBUG for more detail in the log
      #
      # UNSAFE options: off unless you remove the #. Read "Unsafe options" in the README first.
      # UNSAFE_NO_LOGIN: "true"   # UNSAFE: no login at all, anyone who reaches the page can upload to Paperless
      # UNSAFE_HTTP: "true"       # UNSAFE: login works over plain HTTP, password and documents travel unencrypted
      # BEHIND_PROXY: "false"     # set this when you publish the port below and use no reverse proxy
    # ports:                      # (optional) only without a reverse proxy, see "Unsafe options" in the README
    #   - "8000:8000"
    # volumes:                    # (optional) your own logo: remove the # on this line and the next,
    #   - ./logo.png:/logo:ro     #   then change ./logo.png to the path of a PNG, JPG or WEBP file
    tmpfs:
      - /tmp:size=1g              # files in progress stay in memory and are never written to disk
    # Security hardening, leave as it is
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 200
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: nginx_reverse_proxy   # CHANGE: Docker network shared by your reverse proxy and Paperless
