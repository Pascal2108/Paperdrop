services:
  paperdrop:
    image: ghcr.io/pascal2108/paperdrop:latest
    container_name: paperdrop
    restart: unless-stopped
    env_file:
      - secrets.env
    environment:
      PAPERLESS_URL: http://paperless-webserver-1:8000   # CHANGE: container name of your Paperless webserver
      # APP_NAME: Paperdrop       # (optional) name shown on the page
      # GS_QUALITY: ebook         # (optional) preselected compression: printer (light), ebook (balanced) or screen (strong)
      # MAX_UPLOAD_MB: 200        # (optional) largest accepted file in MB
      # SESSION_MINUTES: 30       # (optional) minutes a login stays valid without activity
      # KEEP_MINUTES: 30          # (optional) minutes until files that were neither uploaded nor deleted are removed
      # LOG_LEVEL: INFO           # (optional) DEBUG for more detail in the log
    volumes:
      - tmp:/tmp
      # - ./logo.png:/logo:ro     # (optional) your own logo: change ./logo.png to the path of a PNG, JPG or WEBP file
    # Security hardening, leave as it is
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 200
    networks:
      - proxy

volumes:
  tmp:

networks:
  proxy:
    external: true
    name: nginx_reverse_proxy   # CHANGE: Docker network shared by your reverse proxy and Paperless
