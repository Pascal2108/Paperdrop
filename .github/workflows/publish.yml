name: Build and publish image

on:
  push:
    branches: [main, beta]
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild, picks up security updates of the base image and libraries
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for Intel/AMD and ARM servers (e.g. Raspberry Pi, ARM cloud instances)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # main is published as :latest, the beta branch as :beta
          tags: ghcr.io/pascal2108/paperdrop:${{ github.ref_name == 'main' && 'latest' || 'beta' }}
