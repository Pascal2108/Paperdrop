name: Build and publish image

on:
  push:
    branches: [main, beta]
    tags: ["v*.*.*"]      # a version tag such as v1.0.0 makes a release
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild, picks up security updates of the base image and libraries
  workflow_dispatch:

# Each job asks for what it needs on top of this
permissions:
  contents: read

# Actions are pinned to a commit, since a tag can be moved to other code; Dependabot updates them
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # main is published as :latest, the beta branch as :beta, the tag v1.0.0 as :1.0.0
      - id: image
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)    echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            *)               echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for Intel/AMD and ARM servers (e.g. Raspberry Pi, ARM cloud instances)
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pascal2108/paperdrop:${{ steps.image.outputs.tag }}

  # A version tag also gets a release page on GitHub, once its image exists
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
