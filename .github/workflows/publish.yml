name: Build and publish image

on:
  push:
    branches: [main, beta]
    tags: ["v*.*.*"]      # a version tag such as v1.0.0 makes a release
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild, picks up security updates of the base image and libraries
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main is published as :latest, the beta branch as :beta, the tag v1.0.0 as :1.0.0
      - id: image
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)    echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            *)               echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for Intel/AMD and ARM servers (e.g. Raspberry Pi, ARM cloud instances)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pascal2108/paperdrop:${{ steps.image.outputs.tag }}

  # A version tag also gets a release page on GitHub, once its image exists
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
